# slf4j-simple configuration.
#
# GitVantage doesn't log anything itself; a provider exists only so that libraries which log
# through SLF4J (dbus-java in particular) aren't silently discarded — that silence is what once
# hid a D-Bus failure until the native file chooser visibly degraded to the Swing one.
#
# Default is INFO, which puts routine library chatter on stderr on every launch. WARN keeps the
# terminal clean while still surfacing real problems. To debug, run with
#   -Dorg.slf4j.simpleLogger.defaultLogLevel=debug
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
