# Build with JDK 17–21. Gradle 8.14's embedded Kotlin DSL compiler cannot parse the
# Java 25 version string and fails before the build script is even read, so the Gradle
# *daemon* must run on a JDK <= 21 (Nucleus itself requires JDK 17+).
#
# - CI: the Nucleus setup action is pinned to JBR 21 (see .github/workflows/).
# - Local: a project-scoped JDK 21 is declared in .mise.toml (mise/asdf users get it
#   automatically); otherwise point JAVA_HOME at a JDK <= 21 before running ./gradlew.
#
# We intentionally do NOT hard-code org.gradle.java.home here — an absolute path is
# machine-specific and would break clones and CI.
