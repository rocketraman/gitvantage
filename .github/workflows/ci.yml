name: CI

# Build and run tests for every branch push and pull request. Tag pushes (v*) don't
# match the branch filter, so releases are handled by release.yml instead.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Nucleus's own setup action: installs the JetBrains Runtime and Gradle. We pin the
      # JBR to 25. No packaging tools or Node needed for a plain build + test.
      # Pin @main to a released Nucleus tag once you've settled on a version.
      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@764ed3f9b09445d011f9f078310a58c0747d4dca # main
        with:
          java-version: '25'
          packaging-tools: 'false'
          setup-node: 'false'

      - name: Build + test
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gradle-build-reports
          path: build/reports
          retention-days: 7
