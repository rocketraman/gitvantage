name: Release

# On a version tag (v1.2.3), build the native installers on each OS/arch in parallel
# and attach them to a GitHub Release. workflow_dispatch lets you dry-run the build
# (without publishing) before cutting a real tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the dry-run build. Must be 1-3 dot-separated integers with a major of at least 1 — jpackage on macOS rejects a zero major version.'
        default: '9.9.9'
        required: false

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest,   arch: amd64 }
          - { os: macos-latest,     arch: arm64 }   # Apple Silicon
          - { os: macos-15-intel,   arch: amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90   # GraalVM native-image builds are slow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Nucleus setup: JBR 25, Linux packaging tools, and the GraalVM native-image build
      # prerequisites (build.gradle enables graalvm { }). The GraalVM JDK itself is
      # auto-provisioned by the Nucleus Gradle plugin.
      # Pin @main to a released Nucleus tag once you've settled on a version.
      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@764ed3f9b09445d011f9f078310a58c0747d4dca # main
        with:
          java-version: '25'
          packaging-tools: 'true'
          graalvm: 'true'
          # Match the pin in build.gradle.kts. The action does not choose the toolchain — the
          # plugin downloads it — but this value goes into its cache key, so leaving it at the
          # action's own default (25i2) labels the cache with a version we never install.
          graalvm-version: '25i1'

      # packageGraalvmDistributionForCurrentOS, NOT packageReleaseDistributionForCurrentOS: the
      # latter is the jpackage aggregate, and calling it is how v1.0.0 shipped a bundled-JVM app
      # image on every platform while native-image never ran (see the long note in build.gradle.kts).
      # The GraalVM tasks carry no build-type classifier because the plugin binds that pipeline to
      # the default build type.
      #
      # This task is gated by verifyGraalvmNativeImage, which fails the build if the bundle handed
      # to the packagers embeds a Java runtime — i.e. if we are silently back on the jpackage path.
      # That gate is load-bearing on every platform, not just macOS: the jpackage launcher also
      # SIGSEGVs at startup on Linux once the classpath is large enough (JDK-8380085, unfixed in
      # the 25u we package with — see NucleusFramework/Nucleus#454 and the note in build.gradle.kts).
      #
      # Note the jpackage-era gates (verifyReleaseBytecode, smokeTestReleaseImage) do NOT run here
      # any more: they are finalizers of packageRelease*, and they inspect the jlink'd image that is
      # no longer built. Their subject was ProGuard damage, and the GraalVM pipeline does not run
      # ProGuard at all. Replacing that coverage is still open.
      # On a tag push build.gradle takes the version from GITHUB_REF_NAME. A workflow_dispatch has no
      # version in its ref, and checkout@v4's shallow clone carries no tags for the `git describe`
      # fallback, so it lands on the last resort of 0.0.0 — which jpackage *rejects on macOS* ("the
      # first number in an app-version cannot be zero or negative") while Linux and Windows accept
      # it. The dry-run was therefore structurally incapable of covering macOS, which is how a
      # macOS-only packaging bug reached a tagged release in the first place.
      #
      # Passed as ORG_GRADLE_PROJECT_appVersion rather than interpolated into the run: line, so a
      # dispatch input can't be injected into the shell. On a tag push the input is unset, the env
      # var is empty, build.gradle's regex rejects it, and GITHUB_REF_NAME wins as before.
      - name: Build native-image distribution (incl. verification)
        env:
          ORG_GRADLE_PROJECT_appVersion: ${{ inputs.version }}
          # The plugin resolves the GraalVM CE download by listing
          # github.com/graalvm/graalvm-ce-builds releases. Unauthenticated calls are capped at
          # 60/hour *per runner IP*, which on shared GitHub-hosted runners is routinely already
          # exhausted: the first dispatch of this workflow died on HTTP 403 in nativeImageCompile
          # before native-image ever started. GraalvmToolchainProvisioner reads GITHUB_TOKEN (or
          # GH_TOKEN) and sends it as a bearer token, which raises the limit to 1000/hour.
          #
          # This is the job's own scoped token — it is not a secret shared with the toolchain host;
          # it authenticates the api.github.com request only.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew packageGraalvmDistributionForCurrentOS --stacktrace --no-daemon

      # When jpackage fails, Gradle reports only "External tool execution failed" plus the paths of
      # two log files on the runner — which are then thrown away with the runner, so the actual
      # cause never reaches the CI output and the failure is undiagnosable from here. Print them.
      - name: Dump packaging tool logs
        if: failure()
        shell: bash
        run: |
          # Use find, not a **/ glob: the macOS runners' /bin/bash is 3.2, which has no globstar,
          # and `shopt -s globstar` there fails the step outright — on the one platform whose
          # packaging failures need this most.
          found=0
          while IFS= read -r f; do
            found=1
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done < <(find build/compose/logs -type f -name '*.txt' 2>/dev/null)
          [ "$found" = 1 ] || echo "No packaging tool logs under build/compose/logs/."

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          # The GraalVM pipeline is bound to the default build type, so its output lands under
          # main/ rather than main-release/, and each format gets a graalvm- prefixed subdirectory
          # (AbstractElectronBuilderPackageTask: "$appDirName/graalvm-${outputDirName}").
          # Naming them explicitly rather than globbing recursively keeps the unpacked app bundle
          # out — otherwise the raw native binary inside it would be uploaded as a release asset.
          path: |
            build/compose/binaries/main/graalvm-deb/*.deb
            build/compose/binaries/main/graalvm-rpm/*.rpm
            build/compose/binaries/main/graalvm-dmg/*.dmg
            build/compose/binaries/main/graalvm-msi/*.msi
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')   # only publish for real tag pushes
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist   # keeps each job's `release-assets-*` as its own subdirectory

      # Nucleus's publish action: creates the GitHub Release and uploads every installer.
      # It shells out to `gh` but declares no token input and sets no GH_TOKEN itself, so the
      # calling workflow has to provide one or every gh call fails with "set the GH_TOKEN
      # environment variable". The job's `contents: write` permission covers what it needs.
      - uses: NucleusFramework/Nucleus/.github/actions/publish-release@764ed3f9b09445d011f9f078310a58c0747d4dca # main
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repo out (it only downloads artifacts), so `gh` has no git
          # remote to infer the repository from — without GH_REPO it fails with
          # "not a git repository".
          GH_REPO: ${{ github.repository }}
        with:
          artifacts-path: dist
          tag: ${{ github.ref_name }}
          release-type: release
